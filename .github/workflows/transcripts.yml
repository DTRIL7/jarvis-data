name: transcripts

on:
  workflow_dispatch:
    inputs:
      videos:
        description: "YouTube links or ids, separated by spaces"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet youtube-transcript-api
      - run: python transcript.py ${{ github.event.inputs.videos }}
      - name: Commit transcripts
        run: |
          git config user.name "jarvis-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcripts
          git commit -m "transcripts $(date -u +%Y-%m-%dT%H%MZ)" || echo "no changes"
          git pull --rebase -q
          git push
